<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery sản phẩm</title>
    <link rel="stylesheet" href="./bai3.css" />
  </head>

  <body>
    <div class="gallery">
      <!-- Ảnh lớn -->
      <img
        id="main-image"
        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"
        alt="Giày thể thao màu đỏ"
      />

      <!-- 3 ảnh nhỏ -->
      <div class="thumbnails">
        <img
          class="thumbnail active"
          src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200"
          alt="Giày thể thao màu đỏ"
        />

        <img
          class="thumbnail"
          src="https://images.unsplash.com/photo-1549298916-b41d501d3772?w=200"
          alt="Giày thể thao màu trắng"
        />

        <img
          class="thumbnail"
          src="https://images.unsplash.com/photo-1552346154-21d32810aba3?w=200"
          alt="Giày thể thao màu xanh"
        />
      </div>
    </div>

    <script src="./bai3.js"></script>
  </body>
</html>
